<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh name typing animation</title><desc id="desc">The exact UTKARSH ASCII-art name is typed line by line in a terminal.</desc>
<rect width="960" height="230" rx="12" fill="#0d1117"/><rect x="1" y="1" width="958" height="228" rx="11" fill="none" stroke="#30363d"/>
<defs>
<clipPath id="line0"><rect x="20" y="40" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
<clipPath id="line1"><rect x="20" y="68" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="2.8s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
<clipPath id="line2"><rect x="20" y="96" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="5.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
<clipPath id="line3"><rect x="20" y="124" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="7.6s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
<clipPath id="line4"><rect x="20" y="152" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="10s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
<clipPath id="line5"><rect x="20" y="180" width="0" height="25"><animate attributeName="width" from="0" to="920" dur="2.3s" begin="12.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.8 1" keyTimes="0;1"/></rect></clipPath>
</defs>
<text x="24" y="28" font-family="Consolas, monospace" font-size="13" fill="#8b949e">utkarsh@cloud:~$</text>
<g font-family="Consolas, 'Courier New', monospace" font-size="18" xml:space="preserve" fill="#00ff9c">
<text x="24" y="58" clip-path="url(#line0)">██╗   ██╗████████╗██╗  ██╗ █████╗ ██████╗ ███████╗██╗  ██╗</text>
<text x="24" y="86" clip-path="url(#line1)">██║   ██║╚══██╔══╝██║ ██╔╝██╔══██╗██╔══██╗██╔════╝██║  ██║</text>
<text x="24" y="114" clip-path="url(#line2)">██║   ██║   ██║   █████╔╝ ███████║██████╔╝███████╗███████║</text>
<text x="24" y="142" clip-path="url(#line3)">██║   ██║   ██║   ██╔═██╗ ██╔══██╗██╔══██╗╚════╝██║██╔══██║</text>
<text x="24" y="170" clip-path="url(#line4)">╚██████╔╝   ██║   ██║  ██╗██║  ██║██║  ██║███████║██║  ██║</text>
<text x="24" y="198" clip-path="url(#line5)"> ╚═════╝    ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text>
</g>
<text x="24" y="220" font-family="Consolas, monospace" font-size="12" fill="#8b949e">typing identity... <tspan fill="#22d3ee">UTKARSH</tspan><tspan fill="#00ff9c">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>