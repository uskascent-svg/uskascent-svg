<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">UTKARSH ASCII art typing animation</title>
<desc id="desc">Original green terminal ASCII-art name revealed line by line with uneven character-like pauses.</desc>
<rect width="960" height="230" rx="12" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="228" rx="11" fill="none" stroke="#30363d"/>
<text x="24" y="28" font-family="monospace" font-size="13" fill="#8b949e">utkarsh@cloud:~$</text>
<g font-family="monospace" font-size="18" xml:space="preserve" fill="#00ff9c" text-anchor="start">
<text x="150" y="58">██╗   ██╗████████╗██╗  ██╗ █████╗ ██████╗ ███████╗██╗  ██╗<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="2.6s" begin="0.2s" fill="freeze"/></text>
<text x="150" y="86">██║   ██║╚══██╔══╝██║ ██╔╝██╔══██╗██╔══██╗██╔════╝██║  ██║<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="3.1s" begin="2.1s" fill="freeze"/></text>
<text x="150" y="114">██║   ██║   ██║   █████╔╝ ███████║██████╔╝███████╗███████║<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="2.4s" begin="4.5s" fill="freeze"/></text>
<text x="150" y="142">██║   ██║   ██║   ██╔═██╗ ██╔══██╗██╔══██╗╚════██║██╔══██║<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="3.4s" begin="6.7s" fill="freeze"/></text>
<text x="150" y="170">╚██████╔╝   ██║   ██║  ██╗██║  ██║██║  ██║███████║██║  ██║<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="2.8s" begin="9.6s" fill="freeze"/></text>
<text x="150" y="198"> ╚═════╝    ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="3.2s" begin="12s" fill="freeze"/></text>
</g>
<text x="24" y="220" font-family="monospace" font-size="12" fill="#8b949e">typing identity... <tspan fill="#22d3ee">UTKARSH</tspan><tspan fill="#00ff9c">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>