<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
<title id="title">UTKARSH — terminal typing animation</title>
<desc id="desc">A bold, colorful, terminal-style ASCII inspired name reveal with a cyan-green-blue gradient and offset shadow, typed with irregular pauses.</desc>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f5a0"/>
    <stop offset=".48" stop-color="#00d9d5"/>
    <stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <clipPath id="typed"><rect x="28" y="22" width="0" height="112" rx="2"><animate attributeName="width" values="0;62;124;186;248;310;372;434;496;558;620;682;744;806" keyTimes="0;.06;.13;.19;.28;.34;.43;.49;.57;.65;.72;.81;.9;1" dur="3.4s" begin=".4s" fill="freeze"/></rect></clipPath>
  <filter id="glow" x="-10%" y="-20%" width="120%" height="150%">
    <feGaussianBlur stdDeviation="1.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="960" height="180" rx="10" fill="#0d1117"/>
<g font-family="monospace" font-weight="900" font-size="104" letter-spacing="-5">
  <text x="31" y="113" fill="#006b5a" opacity=".9">UTKARSH</text>
  <text x="35" y="117" fill="#075985" opacity=".85">UTKARSH</text>
  <g clip-path="url(#typed)" filter="url(#glow)">
    <text x="28" y="109" fill="url(#ink)">UTKARSH</text>
    <text x="28" y="109" fill="none" stroke="#b8fff0" stroke-opacity=".35" stroke-width="1">UTKARSH</text>
  </g>
</g>
<text x="30" y="151" font-family="monospace" font-size="14" fill="#00f5a0">utkarsh@cloud:~$</text>
<text x="195" y="151" font-family="monospace" font-size="14" fill="#aab4c0">figlet -f ansi_shadow utkarsh</text>
<rect x="30" y="161" width="9" height="13" rx="1" fill="#00f5a0"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
</svg>