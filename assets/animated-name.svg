<text x="24" y="28" font-family="monospace" font-size="13" fill="#8b949e">utkarsh@cloud:~$</text>
<g font-family="monospace" font-size="18" xml:space="preserve" fill="#00ff9c" text-anchor="start">
<text x="80" y="58" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line0)">██╗   ██╗████████╗██╗  ██╗ █████╗ ██████╗ ███████╗██╗  ██╗</text>
<text x="80" y="86" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line1)">██║   ██║╚══██╔══╝██║ ██╔╝██╔══██╗██╔══██╗██╔════╝██║  ██║</text>
<text x="80" y="114" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line2)">██║   ██║   ██║   █████╔╝ ███████║██████╔╝███████╗███████║</text>
<text x="80" y="142" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line3)">██║   ██║   ██║   ██╔═██╗ ██╔══██╗██╔══██╗╚════██║██╔══██║</text>
<text x="80" y="170" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line4)">╚██████╔╝   ██║   ██║  ██╗██║  ██║██║  ██║███████║██║  ██║</text>
<text x="80" y="198" textLength="800" lengthAdjust="spacingAndGlyphs" clip-path="url(#line5)"> ╚═════╝    ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text>
</g>
<text x="24" y="220" font-family="monospace" font-size="12" fill="#8b949e">typing identity... <tspan fill="#22d3ee">UTKARSH</tspan><tspan fill="#00ff9c">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>