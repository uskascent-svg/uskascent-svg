<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh name typing animation</title>
<desc id="desc">Responsive terminal-style UTKARSH ASCII-art typing animation.</desc>
<rect width="960" height="230" rx="12" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="228" rx="11" fill="none" stroke="#30363d"/>
<defs>
<clipPath id="line0"><rect x="80" y="38" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="0.4s" fill="freeze"/></rect></clipPath>
<clipPath id="line1"><rect x="80" y="66" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="2.8s" fill="freeze"/></rect></clipPath>
<clipPath id="line2"><rect x="80" y="94" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="5.2s" fill="freeze"/></rect></clipPath>
<clipPath id="line3"><rect x="80" y="122" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="7.6s" fill="freeze"/></rect></clipPath>
<clipPath id="line4"><rect x="80" y="150" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="10s" fill="freeze"/></rect></clipPath>
<clipPath id="line5"><rect x="80" y="178" width="0" height="27"><animate attributeName="width" from="0" to="800" dur="2.3s" begin="12.4s" fill="freeze"/></rect></clipPath>
