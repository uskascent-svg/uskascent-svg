<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">UTKARSH — blackletter human typing glitch animation</title>
<desc id="desc">The complete name UTKARSH types in from left to right in angular Gothic lettering, with natural pauses, a blinking cursor and brief cyan-magenta glitch bursts.</desc>
<defs>
 <g id="U" fill="currentColor" fill-rule="evenodd"><path d="M0 0H28V118L47 137L66 118V0H94V131L47 177L0 131Z"/><path d="M28 0H48V113L28 95Z"/></g>
 <g id="T" fill="currentColor" fill-rule="evenodd"><path d="M0 0H112L94 25H68V177H40V25H0Z"/><path d="M40 25H68L48 48H40Z"/></g>
 <g id="K" fill="currentColor" fill-rule="evenodd"><path d="M0 0H28V177H0Z"/><path d="M28 77L84 0H115L65 78L116 177H85L43 99L28 119Z"/><path d="M28 77H55L39 96H28Z"/></g>
 <g id="A" fill="currentColor" fill-rule="evenodd"><path d="M0 177L31 0H62L95 177H66L60 137H32L26 177Z"/><path d="M36 111H57L47 49Z"/><path d="M32 111L47 94L60 111Z"/></g>
 <g id="R" fill="currentColor" fill-rule="evenodd"><path d="M0 0H62Q88 0 88 26V54Q88 70 71 81Q90 90 90 109V177H62V111Q62 96 46 96H28V177H0Z"/><path d="M28 25V70H49Q61 70 61 55V37Q61 25 49 25Z"/><path d="M43 96H67L91 177H62Z"/></g>
 <g id="S" fill="currentColor" fill-rule="evenodd"><path d="M87 0H20L0 20V65L19 82H59V151H0V177H68L87 157V93L69 70H28V25H87Z"/><path d="M40 25H65L48 43H28Z"/><path d="M26 134H59L42 152H26Z"/></g>
 <g id="H" fill="currentColor" fill-rule="evenodd"><path d="M0 0H28V70H68V0H96V177H68V97H28V177H0Z"/><path d="M28 70H52L39 87H28Z"/></g>
</defs>
<rect width="1000" height="300" rx="12" fill="#08090d"/>
<path d="M24 42H976M24 255H976" stroke="#27313b"/>
<text x="30" y="28" fill="#8492a3" font-family="monospace" font-size="13">utkarsh@terminal:~$ type identity</text>
<g transform="translate(55 56)" class="letter letter-u"><use xlink:href="#U" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#U" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#U" color="#f3f5f7"/></g>
<g transform="translate(178 56)" class="letter letter-t"><use xlink:href="#T" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#T" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#T" color="#f3f5f7"/></g>
<g transform="translate(310 56)" class="letter letter-k"><use xlink:href="#K" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#K" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#K" color="#f3f5f7"/></g>
<g transform="translate(442 56)" class="letter letter-a"><use xlink:href="#A" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#A" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#A" color="#f3f5f7"/></g>
<g transform="translate(552 56)" class="letter letter-r"><use xlink:href="#R" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#R" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#R" color="#f3f5f7"/></g>
<g transform="translate(670 56)" class="letter letter-s"><use xlink:href="#S" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#S" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#S" color="#f3f5f7"/></g>
<g transform="translate(785 56)" class="letter letter-h"><use xlink:href="#H" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#H" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#H" color="#f3f5f7"/></g>
<g fill="#00e5ff" opacity=".7"><rect x="32" y="269" width="18" height="3"/><rect x="55" y="269" width="6" height="3"/><rect x="66" y="269" width="14" height="3"/></g>
<text x="92" y="280" fill="#a5b1c0" font-family="monospace" font-size="12" letter-spacing="2">U T K A R S H</text>
<text x="820" y="280" fill="#ff245f" font-family="monospace" font-size="12">GLITCH//LIVE</text>
<rect id="cursor" x="52" y="244" width="10" height="3" fill="#00e5ff"><animate attributeName="x" values="52;175;307;439;549;667;782;900;52" keyTimes="0;.12;.24;.36;.48;.60;.72;.84;1" dur="6.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;1" dur=".72s" repeatCount="indefinite"/></rect>
<style>
.letter{opacity:1;animation:typed-in .32s steps(1,end) backwards}
.letter-u{animation-delay:.28s}.letter-t{animation-delay:1.05s}.letter-k{animation-delay:1.76s}.letter-a{animation-delay:2.48s}.letter-r{animation-delay:3.34s}.letter-s{animation-delay:4.08s}.letter-h{animation-delay:4.92s}
@keyframes typed-in{0%{opacity:0;filter:brightness(.4);transform:translateY(3px)}20%{opacity:.25;filter:brightness(1.8);transform:translateY(-1px)}42%{opacity:.65;filter:brightness(.8);transform:translateY(1px)}65%,100%{opacity:1;filter:brightness(1);transform:translateY(0)}}
.glitch-cyan{opacity:.5;animation:gc 4.1s steps(1,end) infinite}
.glitch-pink{opacity:.5;animation:gp 4.1s steps(1,end) infinite}
@keyframes gc{0%,78%,87%,100%{transform:translate(-3px,0);opacity:.5}79%{transform:translate(10px,-3px);opacity:1}80%{transform:translate(-12px,2px);opacity:.85}81%{transform:translate(4px,0);opacity:.9}}
@keyframes gp{0%,78%,87%,100%{transform:translate(3px,0);opacity:.5}79%{transform:translate(-9px,2px);opacity:1}80%{transform:translate(11px,-2px);opacity:.85}81%{transform:translate(-4px,0);opacity:.9}}
@media(prefers-reduced-motion:reduce){.letter,.glitch-cyan,.glitch-pink{animation:none!important;opacity:1}}
</style>
</svg>