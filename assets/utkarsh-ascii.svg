<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
<title id="title">UTKARSH — reference blackletter typing glitch animation</title>
<desc id="desc">UTKARSH drawn from the supplied Gothic alphabet reference, appearing letter by letter with human-like pauses, blinking cursor and brief cyan-magenta glitch bursts.</desc>
<defs>
<path id="glyph-A" fill="currentColor" fill-rule="evenodd" d="M44,0 L88,26 L88,55 L104,67 L104,178 L124,196 L108,214 L79,192 L79,137 L42,137 L42,178 L0,207 L0,70 L25,47 L25,173 L42,160 L42,104 L79,104 L79,63 L44,43 L25,60 L25,104 L0,104 L0,70 Z"/>
<path id="glyph-H" fill="currentColor" fill-rule="evenodd" d="M0,0 L27,25 L27,77 L49,77 L49,47 L27,25 L53,0 L78,25 L78,77 L100,77 L100,25 L126,0 L153,25 L153,165 L179,189 L153,211 L126,190 L126,111 L78,111 L78,176 L53,205 L27,181 L27,111 L0,91 Z M27,111 L49,111 L49,160 L27,177 Z"/>
<path id="glyph-K" fill="currentColor" fill-rule="evenodd" d="M0,26 L28,0 L55,25 L55,78 L80,54 L80,31 L109,5 L137,28 L116,48 L116,64 L89,88 L118,106 L118,130 L145,153 L119,179 L91,157 L91,135 L55,111 L55,177 L28,205 L0,181 Z M55,78 L80,91 L55,108 Z"/>
<path id="glyph-R" fill="currentColor" fill-rule="evenodd" d="M0,27 L27,0 L102,0 L126,22 L126,57 L110,74 L91,84 L112,96 L136,174 L108,195 L83,121 L55,121 L55,169 L28,195 L0,176 Z M55,29 L55,87 L78,87 L95,70 L98,51 L87,29 Z"/>
<path id="glyph-S" fill="currentColor" fill-rule="evenodd" d="M102,0 L80,24 L49,24 L49,61 L80,61 L105,82 L116,100 L116,155 L94,179 L69,202 L43,183 L0,153 L23,129 L49,147 L69,164 L81,152 L81,119 L69,106 L37,106 L12,86 L12,45 L35,22 L58,0 Z M49,43 L49,74 L69,74 L69,43 Z"/>
<path id="glyph-T" fill="currentColor" fill-rule="evenodd" d="M0,0 L147,0 L126,27 L94,27 L94,166 L67,193 L40,169 L40,27 L0,27 L20,0 Z M40,27 L67,27 L67,145 L54,158 L40,145 Z"/>
<path id="glyph-U" fill="currentColor" fill-rule="evenodd" d="M0,25 L27,0 L54,25 L54,137 L77,155 L99,137 L99,25 L126,0 L153,25 L153,151 L134,174 L99,198 L77,194 L38,170 L0,143 Z M27,45 L27,128 L54,146 L54,45 Z M99,45 L126,45 L126,128 L99,146 Z"/>
</defs>
<rect width="1000" height="300" rx="12" fill="#08090d"/>
<path d="M24 42H976M24 255H976" stroke="#27313b"/>
<text x="30" y="28" fill="#8492a3" font-family="monospace" font-size="13">utkarsh@terminal:~$ type identity</text>
<g transform="translate(55 56) scale(.745 .855)" class="letter letter-u"><use xlink:href="#glyph-U" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-U" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-U" color="#f3f5f7"/></g>
<g transform="translate(170 56) scale(.618 .889)" class="letter letter-t"><use xlink:href="#glyph-T" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-T" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-T" color="#f3f5f7"/></g>
<g transform="translate(285 56) scale(.643 .855)" class="letter letter-k"><use xlink:href="#glyph-K" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-K" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-K" color="#f3f5f7"/></g>
<g transform="translate(405 56) scale(.745 .903)" class="letter letter-a"><use xlink:href="#glyph-A" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-A" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-A" color="#f3f5f7"/></g>
<g transform="translate(520 56) scale(.633 .903)" class="letter letter-r"><use xlink:href="#glyph-R" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-R" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-R" color="#f3f5f7"/></g>
<g transform="translate(630 56) scale(.720 .863)" class="letter letter-s"><use xlink:href="#glyph-S" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-S" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-S" color="#f3f5f7"/></g>
<g transform="translate(735 56) scale(.659 .855)" class="letter letter-h"><use xlink:href="#glyph-H" color="#00e5ff" transform="translate(-3 0)" class="glitch-cyan"/><use xlink:href="#glyph-H" color="#ff245f" transform="translate(3 0)" class="glitch-pink"/><use xlink:href="#glyph-H" color="#f3f5f7"/></g>
<g fill="#00e5ff" opacity=".7"><rect x="32" y="269" width="18" height="3"/><rect x="55" y="269" width="6" height="3"/><rect x="66" y="269" width="14" height="3"/></g>
<text x="92" y="280" fill="#a5b1c0" font-family="monospace" font-size="12" letter-spacing="2">U T K A R S H</text>
<text x="820" y="280" fill="#ff245f" font-family="monospace" font-size="12">GLITCH//LIVE</text>
<rect id="cursor" x="52" y="244" width="10" height="3" fill="#00e5ff"><animate attributeName="x" values="52;175;290;410;525;635;740;900;52" keyTimes="0;.12;.24;.36;.48;.60;.72;.84;1" dur="6.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;1" dur=".72s" repeatCount="indefinite"/></rect>
<style>
.letter{opacity:1;animation:typed-in .32s steps(1,end) backwards}
.letter-u{animation-delay:.28s}.letter-t{animation-delay:1.05s}.letter-k{animation-delay:1.76s}.letter-a{animation-delay:2.48s}.letter-r{animation-delay:3.34s}.letter-s{animation-delay:4.08s}.letter-h{animation-delay:4.92s}
@keyframes typed-in{0%{opacity:0;filter:brightness(.4);transform:translateY(3px)}20%{opacity:.25;filter:brightness(1.8);transform:translateY(-1px)}42%{opacity:.65;filter:brightness(.8);transform:translateY(1px)}65%,100%{opacity:1;filter:brightness(1);transform:translateY(0)}}
.glitch-cyan{opacity:.5;animation:gc 4.1s steps(1,end) infinite}
.glitch-pink{opacity:.5;animation:gp 4.1s steps(1,end) infinite}
@keyframes gc{0%,78%,87%,100%{transform:translate(-3px,0);opacity:.5}79%{transform:translate(10px,-3px);opacity:1}80%{transform:translate(-12px,2px);opacity:.85}81%{transform:translate(4px,0);opacity:.9}}
@keyframes gp{0%,78%,87%,100%{transform:translate(3px,0);opacity:.5}79%{transform:translate(-9px,2px);opacity:1}80%{transform:translate(11px,-2px);opacity:.85}81%{transform:translate(-4px,0);opacity:.9}}
@media(prefers-reduced-motion:reduce){.letter,.glitch-cyan,.glitch-pink{animation:none!important;opacity:1}}
</style>
</svg>