<text x="45" y="254" font-family="monospace" font-size="14" fill="#8b949e">typing identity... <tspan fill="#22d3ee" font-weight="bold">UTKARSH</tspan></text>
<rect x="272" y="242" width="8" height="15" fill="#00ff9c"><animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect>
</svg>