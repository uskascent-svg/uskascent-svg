<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="auto" viewBox="0 0 960 280"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="title desc">
  <title id="title">UTKARSH ASCII typing animation</title>
  <desc id="desc">Responsive terminal-style UTKARSH ASCII art that types line by line in neon green, with a blinking cursor.</desc>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    .frame { fill: #0d1117; }
    .border { fill: none; stroke: #30363d; }
    .muted { fill: #8b949e; font-size: 14px; }
    .art {
      fill: #00ff9c;
      font-size: 18px;
      white-space: pre;
    }
    .reveal { overflow: hidden; }
    .reveal rect {
      width: 0;
      animation: type-line 10s steps(48, end) infinite;
    }
    .line-1 rect { animation-delay: .25s; }
    .line-2 rect { animation-delay: 1.45s; }
    .line-3 rect { animation-delay: 2.65s; }
    .line-4 rect { animation-delay: 3.85s; }
    .line-5 rect { animation-delay: 5.05s; }
    .line-6 rect { animation-delay: 6.25s; }
    .cursor {
      fill: #00ff9c;
      animation: blink .9s steps(2, start) infinite;
    }
    .name { fill: #22d3ee; font-weight: 700; }
    @keyframes type-line {
      0%, 3% { width: 0; }
      14%, 100% { width: 878px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal rect { animation: none; width: 878px; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect class="frame" width="960" height="280" rx="12"/>
  <rect class="border" x="1" y="1" width="958" height="278" rx="11"/>

  <text class="muted" x="45" y="36">utkarsh@cloud:~$</text>

  <defs>
    <clipPath id="line1"><rect x="41" y="55" width="878" height="30"/></clipPath>
    <clipPath id="line2"><rect x="41" y="83" width="878" height="30"/></clipPath>
    <clipPath id="line3"><rect x="41" y="111" width="878" height="30"/></clipPath>
    <clipPath id="line4"><rect x="41" y="139" width="878" height="30"/></clipPath>
    <clipPath id="line5"><rect x="41" y="167" width="878" height="30"/></clipPath>
    <clipPath id="line6"><rect x="41" y="195" width="878" height="30"/></clipPath>
  </defs>

  <g class="art" xml:space="preserve">
    <g class="reveal line-1" clip-path="url(#line1)"><text x="45" y="78">██╗   ██╗████████╗██╗  ██╗ █████╗ ██████╗ ███████╗██╗  ██╗</text></g>
    <g class="reveal line-2" clip-path="url(#line2)"><text x="45" y="106">██║   ██║╚══██╔══╝██║ ██╔╝██╔══██╗██╔══██╗██╔════╝██║  ██║</text></g>
    <g class="reveal line-3" clip-path="url(#line3)"><text x="45" y="134">██║   ██║   ██║   █████╔╝ ███████║██████╔╝███████╗███████║</text></g>
    <g class="reveal line-4" clip-path="url(#line4)"><text x="45" y="162">██║   ██║   ██║   ██╔═██╗ ██╔══██╗██╔══██╗╚════██║██╔══██║</text></g>
    <g class="reveal line-5" clip-path="url(#line5)"><text x="45" y="190">╚██████╔╝   ██║   ██║  ██╗██║  ██║██║  ██║███████║██║  ██║</text></g>
    <g class="reveal line-6" clip-path="url(#line6)"><text x="45" y="218"> ╚═════╝    ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text></g>
  </g>

  <text class="muted" x="45" y="254">typing identity... <tspan class="name">UTKARSH</tspan></text>
  <rect class="cursor" x="272" y="242" width="8" height="15" rx="1"/>
</svg>
