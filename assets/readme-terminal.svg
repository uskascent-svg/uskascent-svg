<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">ASCENT U3 animated cybersecurity terminal</title>
<desc id="desc">A green terminal animation showing whoami, expanded security status, and career goals. Text appears progressively with a blinking cursor.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130b"/><stop offset="1" stop-color="#020604"/></linearGradient>
  <clipPath id="screen"><rect x="1" y="1" width="958" height="388" rx="15"/></clipPath>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .prompt{fill:#4dff91;font-weight:700}.out{fill:#d7e8db}.good{fill:#4dff91}.dim{fill:#83a18c}.title{fill:#a5ffc3;font-size:13px;letter-spacing:2px}
    .row{opacity:0;animation:show 24s steps(1,end) infinite}
    .r1{animation-delay:.4s}.r2{animation-delay:2.6s}.r3{animation-delay:5.2s}.r4{animation-delay:7.6s}.r5{animation-delay:9.7s}.r6{animation-delay:12.2s}.r7{animation-delay:14.3s}.r8{animation-delay:16.7s}.r9{animation-delay:18.9s}
    @keyframes show{0%{opacity:0}1%,99%{opacity:1}100%{opacity:0}}
    .cursor{fill:#4dff91;animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    @media(prefers-reduced-motion:reduce){.row{opacity:1;animation:none}.cursor{animation:none;visibility:visible}}
  </style>
</defs>
<g clip-path="url(#screen)">
<rect width="960" height="390" rx="15" fill="url(#bg)"/>
<rect width="960" height="42" fill="#101a13"/>
<circle cx="23" cy="21" r="5" fill="#ff625d"/><circle cx="41" cy="21" r="5" fill="#ffc04d"/><circle cx="59" cy="21" r="5" fill="#42d66b"/>
<text x="82" y="26" class="title">ASCENT U3 / CYBER DEFENCE CONSOLE</text>
<text x="934" y="26" text-anchor="end" class="dim" font-size="11">SAFE PROFILE SIMULATION</text>
<line x1="0" y1="42" x2="960" y2="42" stroke="#20382a"/>
<g font-size="16">
<text x="28" y="78" class="prompt">$ whoami</text>
<g class="row r1"><text x="28" y="105" class="out">IT Engineering student</text></g>
<g class="row r2"><text x="28" y="131" class="out">MET BKC IOE Nashik</text></g>
<g class="row r3"><text x="28" y="166" class="prompt">$ cat status.log</text></g>
<g class="row r4"><text x="28" y="193" class="good">[ OK ] Cybersecurity · Blue Team · Cloud Security</text></g>
<g class="row r5"><text x="28" y="220" class="good">[ OK ] Email Phishing Detection System</text></g>
<g class="row r6"><text x="28" y="247" class="dim">[ .. ] SOC Operations · Threat Detection · AI Security</text></g>
<g class="row r7"><text x="28" y="282" class="prompt">$ ./career.sh --goal</text></g>
<g class="row r8"><text x="28" y="309" class="good">→ Aspiring Cybersecurity / SOC Analyst</text></g>
<g class="row r9"><text x="28" y="336" class="out">→ Learning by building · testing · defending</text></g>
<rect class="cursor" x="28" y="354" width="10" height="19" rx="1"/>
<text x="48" y="369" class="dim" font-size="12">DETECT. PREVENT. PROTECT.</text>
</g>
</g>
<rect x=".5" y=".5" width="959" height="389" rx="15" fill="none" stroke="#294a34"/>
</svg>