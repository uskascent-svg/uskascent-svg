<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh's animated cybersecurity terminal</title>
<desc id="desc">A dark terminal window with animated command typing, cybersecurity profile details, and a blinking cursor.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <clipPath id="window"><rect x="1" y="1" width="958" height="388" rx="13"/></clipPath>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .muted{fill:#8b949e}.white{fill:#e6edf3}.green{fill:#00ff9c}.cyan{fill:#22d3ee}.amber{fill:#f59e0b}.pink{fill:#f472b6}
    .reveal{opacity:0;animation:show .6s ease-out forwards}
    .line1{animation-delay:.7s}.line2{animation-delay:1.8s}.line3{animation-delay:2.9s}.line4{animation-delay:4s}.line5{animation-delay:5.1s}.line6{animation-delay:6.2s}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes blink{to{opacity:0}}
    @media (prefers-reduced-motion: reduce){.reveal{opacity:1;animation:none}.cursor{animation:none}}
  </style>
</defs>
<g clip-path="url(#window)">
  <rect width="960" height="390" fill="#0d1117"/>
  <rect width="960" height="43" fill="#161b22"/>
  <path d="M0 43H960" stroke="#30363d"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="480" y="26" font-size="13" text-anchor="middle" class="muted">utkarsh@cloud: ~ — bash</text>
  <text x="28" y="76" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">whoami</tspan></text>
  <text x="28" y="106" font-size="16" class="white reveal line1">IT Engineering student · MET BKC IOE Nashik</text>
  <text x="28" y="142" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">cat status.log</tspan></text>
  <text x="28" y="174" font-size="15" class="reveal line2"><tspan class="green">[ OK ]</tspan><tspan class="white"> Cybersecurity · Blue Team · Cloud Security</tspan></text>
  <text x="28" y="202" font-size="15" class="reveal line3"><tspan class="green">[ OK ]</tspan><tspan class="white"> Email Phishing Detection System</tspan></text>
  <text x="28" y="230" font-size="15" class="reveal line4"><tspan class="amber">[ .. ]</tspan><tspan class="white"> SOC Operations · Threat Detection · AI Security</tspan></text>
  <text x="28" y="270" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">./career.sh --goal</tspan></text>
  <text x="28" y="300" font-size="15" class="white reveal line5">→ Aspiring Cybersecurity / SOC Analyst</text>
  <text x="28" y="328" font-size="15" class="white reveal line6">→ Learning by building · testing · defending</text>
  <text x="28" y="363" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="cursor" fill="url(#accent)">█</tspan></text>
  <rect x="1" y="1" width="958" height="388" rx="13" fill="none" stroke="#30363d"/>
</g>
</svg>