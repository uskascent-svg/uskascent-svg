<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh's animated cybersecurity terminal profile</title>
<desc id="desc">Terminal commands reveal the student's identity, education, cybersecurity status, and career goal one line at a time.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff9c"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <clipPath id="window"><rect x="1" y="1" width="958" height="428" rx="13"/></clipPath>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
    .muted{fill:#8b949e}.white{fill:#e6edf3}.green{fill:#00ff9c}.cyan{fill:#22d3ee}.amber{fill:#f59e0b}
    .reveal{opacity:0;animation:show .55s ease-out forwards}
    .l1{animation-delay:.5s}.l2{animation-delay:1.1s}.l3{animation-delay:1.7s}.l4{animation-delay:2.5s}.l5{animation-delay:3.1s}.l6{animation-delay:3.7s}.l7{animation-delay:4.3s}.l8{animation-delay:5.1s}.l9{animation-delay:5.8s}.l10{animation-delay:6.5s}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes show{to{opacity:1}} @keyframes blink{to{opacity:0}}
    @media (prefers-reduced-motion:reduce){.reveal{opacity:1;animation:none}.cursor{animation:none}}
  </style>
</defs>
<g clip-path="url(#window)">
  <rect width="960" height="430" fill="#0d1117"/><rect width="960" height="43" fill="#161b22"/><path d="M0 43H960" stroke="#30363d"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="480" y="26" font-size="13" text-anchor="middle" class="muted">utkarsh@cloud: ~ — bash</text>
  <text x="28" y="76" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">whoami</tspan></text>
  <text x="28" y="106" font-size="16" class="white reveal l1">IT Engineering student</text>
  <text x="28" y="132" font-size="16" class="white reveal l2">MET</text>
  <text x="28" y="158" font-size="16" class="white reveal l3">BKC IOE Nashik</text>
  <text x="28" y="194" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">cat status.log</tspan></text>
  <text x="28" y="224" font-size="15" class="reveal l4"><tspan class="green">[ OK ]</tspan><tspan class="white"> Cybersecurity · Blue Team · Cloud Security</tspan></text>
  <text x="28" y="252" font-size="15" class="reveal l5"><tspan class="green">[ OK ]</tspan><tspan class="white"> Email Phishing Detection System</tspan></text>
  <text x="28" y="280" font-size="15" class="reveal l6"><tspan class="amber">[ .. ]</tspan><tspan class="white"> SOC Operations · Threat Detection · AI Security</tspan></text>
  <text x="28" y="316" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="white">./career.sh --goal</tspan></text>
  <text x="28" y="346" font-size="15" class="white reveal l7">→ Aspiring Cybersecurity / SOC Analyst</text>
  <text x="28" y="374" font-size="15" class="white reveal l8">→ Learning by building · testing · defending</text>
  <text x="28" y="410" font-size="15"><tspan class="green">utkarsh</tspan><tspan class="muted">@</tspan><tspan class="cyan">cloud</tspan><tspan class="muted">:~$ </tspan><tspan class="cursor" fill="url(#accent)">█</tspan></text>
  <rect x="1" y="1" width="958" height="428" rx="13" fill="none" stroke="#30363d"/>
</g>
</svg>