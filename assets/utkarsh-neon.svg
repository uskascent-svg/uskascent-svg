<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">UTKARSH — Information Technology Engineering Student | Cybersecurity</title>
<desc id="desc">Neon cyan and electric-blue UTKARSH wordmark with a subtle digital glow, reflecting cybersecurity, cloud computing and threat detection.</desc>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6FFFF"/><stop offset=".45" stop-color="#00D8FF"/><stop offset="1" stop-color="#087BFF"/></linearGradient>
  <radialGradient id="bg"><stop stop-color="#0A2550"/><stop offset="1" stop-color="#030712"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00BFFF" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1000" height="300" rx="22" fill="url(#bg)"/><rect width="1000" height="300" rx="22" fill="url(#grid)"/>
<path d="M28 42H972M28 258H972" stroke="#00BFFF" stroke-opacity=".45"/>
<g filter="url(#glow)" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">
<text x="500" y="158" font-size="112" letter-spacing="12" fill="url(#neon)">UTKARSH</text>
</g>
<text x="500" y="202" text-anchor="middle" fill="#DDF8FF" font-family="monospace" font-size="20" letter-spacing="3">IT ENGINEERING STUDENT  |  CYBERSECURITY</text>
<text x="500" y="238" text-anchor="middle" fill="#65CFFF" font-family="monospace" font-size="14" letter-spacing="2">CLOUD COMPUTING  ·  THREAT DETECTION  ·  AI SECURITY</text>
<circle cx="65" cy="65" r="3" fill="#00D8FF"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="935" cy="235" r="3" fill="#00D8FF"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>