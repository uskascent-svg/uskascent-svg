*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#14271b 0,transparent 55%),var(--bg);color:var(--text);padding:clamp(12px,3vw,32px);display:grid;place-items:center}a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline;color:#fff}button,input{font:inherit}.shell{width:min(780px,100%);border:1px solid var(--line);border-radius:12px;background:rgba(8,13,10,.97);overflow:hidden;box-shadow:0 20px 70px #0007}.bar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.dots{display:flex;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#42664d}.dot:first-child{background:#ff6b65}.dot:nth-child(2){background:#ffc35d}.dot:nth-child(3){background:#70dc87}.identity{display:flex;align-items:center;gap:13px;padding:20px 20px 16px;border-bottom:1px solid #17251b}.logo{width:47px;height:42px;object-fit:contain;background:#030811;border:1px solid #233a2b;border-radius:6px;padding:3px}.name{font-size:clamp(17px,3vw,22px);font-weight:700;color:var(--green);letter-spacing:-.04em}.role{font-size:11px;color:var(--muted);margin-top:3px}.links{margin-left:auto;display:flex;gap:12px;font-size:11px;flex-wrap:wrap;justify-content:flex-end}.main{padding:18px 20px 14px}.hint{font-size:12px;color:var(--muted);margin:0 0 12px}.term{border:1px solid #20382a;border-radius:8px;overflow:hidden;background:#060b07}.termbar{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;background:#0d160f;border-bottom:1px solid #1b2e20;color:#8ca595;font-size:11px}.clear{border:0;background:transparent;color:#9bb4a2;cursor:pointer;padding:3px 0}.clear:hover{color:var(--green)}.output{height:min(43vh,370px);min-height:220px;overflow:auto;padding:14px 13px;scrollbar-color:#294632 #060b07;overflow-wrap:anywhere}.line{margin:0 0 7px;white-space:pre-wrap}.prompt{color:var(--green)}.muted{color:var(--muted)}.error{color:var(--red)}.link{color:var(--cyan)}.inputrow{display:flex;align-items:center;gap:8px;border-top:1px solid #17271c;padding:12px 13px}.promptlabel{color:var(--green);white-space:nowrap}.input{min-width:0;flex:1;color:#e4f8e9;background:transparent;border:0;outline:0;caret-color:var(--green)}.input::placeholder{color:#526b59}.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 13px}.chip{border:1px solid #25412e;border-radius:5px;background:#0c160f;color:#a9e9ba;padding:4px 8px;font-size:11px;cursor:pointer}.chip:hover,.chip:focus-visible{border-color:var(--green);color:#fff}.foot{padding:11px 20px;border-top:1px solid #17271c;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#6f8b77;font-size:10px}@media(max-width:540px){.identity{padding:16px;gap:10px}.logo{width:40px;height:38px}.role{max-width:220px}.links{gap:8px}.main{padding:14px}.output{min-height:200px}.foot{padding:10px 14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>

<body>

<a href="./" aria-label="Open ASCENT U3 logo experience"><img class="logo" src="./assets/ascentu3-original.png" alt="ASCENT U3 logo"></a>
<div><div class="name">Utkarsh Khairnar</div><div class="role">IT Engineering Student · Cybersecurity · Nashik, India</div></div>

<div class="chips" aria-label="Quick commands"><button class="chip" data-cmd="whoami">whoami</button><button class="chip" data-cmd="interests">interests</button><button class="chip" data-cmd="projects">projects</button><button class="chip" data-cmd="contact">contact</button><button class="chip" data-cmd="help">help</button></div>

<script>
(()=>{'use strict';
const PROFILE={

 'help':['Try one of these 50 commands:','whoami · about · education · interests · cybersecurity · soc · cloud · ai-security · network · skills · languages · linux · python · projects · ascent-safety · phishing · rail-eye · e-recycle · kumbhsathi · shop-agent · github · linkedin · leetcode · email · contact · career · goal · learning · currently · location · values · approach · teamwork · events · hackathons · ctf · labs · certifications · resume · collab · opportunities · motto · stack · tools · security · roadmap · stats · socials · open-source · why-security · blue-team · cloud-security · threat-detection · problem-solving · communication · fun-fact · availability · ascentu3']
};
const ALIASES={hi:'whoami',me:'whoami',profile:'about',bio:'about',study:'education',focus:'interests',cyber:'cybersecurity',soc:'soc',ai:'ai-security',projects:'projects',work:'projects',mail:'email',links:'contact',leetcode:'leetcode',linkedin:'linkedin',career:'career',goal:'goal',help:'help',clear:'clear',exit:'exit',quit:'exit'};
const output=document.querySelector('#output'),form=document.querySelector('#form'),input=document.querySelector('#command');
const commands=Object.keys(PROFILE);PROFILE.help=['50 commands:',commands.filter(x=>x!=='help').join(' · ')];
const history=[];let historyIndex=0;
function add(text,kind=''){const p=document.createElement('p');p.className='line'+(kind?' '+kind:'');p.textContent=text;output.append(p);output.scrollTop=output.scrollHeight}
function renderLine(text){const p=document.createElement('p');p.className='line';const match=text.match(/^(.*?)(https?:\/\/\S+|mailto:\S+)$/);if(match){p.append(document.createTextNode(match[1]));const a=document.createElement('a');a.className='link';a.href=match[2];a.textContent=match[2];a.target=match[2].startsWith('http')?'_blank':'_self';if(a.target==='_blank')a.rel='noopener noreferrer';p.append(a)}else p.textContent=text;output.append(p);output.scrollTop=output.scrollHeight}
function run(raw){const value=raw.trim();if(!value)return;add('visitor@ascent:~$ '+value,'prompt');const key=value.toLowerCase().replace(/\s+/g,' ');if(key==='clear'){output.replaceChildren();return}if(key==='exit'||key==='quit'){add('Session remains open. Explore another command.','muted');return}const command=ALIASES[key]||key;if(!Object.prototype.hasOwnProperty.call(PROFILE,command)){add('Unknown command. Type help.','error');return}PROFILE[command].forEach(renderLine)}
form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;history.push(value);historyIndex=history.length;run(value);input.value=''});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();if(historyIndex>0)historyIndex--;input.value=history[historyIndex]||''}else if(e.key==='ArrowDown'){e.preventDefault();if(historyIndex<history.length)historyIndex++;input.value=history[historyIndex]||''}else if(e.key==='Tab'){e.preventDefault();const q=input.value.toLowerCase();const matches=[...new Set([...Object.keys(PROFILE),...Object.keys(ALIASES)])].filter(x=>x.startsWith(q));if(matches.length===1)input.value=matches[0]}});
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.cmd;form.requestSubmit();input.focus()}));
document.querySelector('#clear').addEventListener('click',()=>{output.replaceChildren();input.focus()});
add('Welcome, visitor. Type help to explore.','muted');add('visitor@ascent:~$ _','prompt');
})();
