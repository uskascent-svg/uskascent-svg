name: Generate ASCII name animation
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_name_gif.py"
      - ".github/workflows/generate-name-gif.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render animated GIF
        run: python scripts/generate_name_gif.py
      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animated-name.gif
          if git diff --cached --quiet; then
            echo "GIF is already up to date."
          else
            git commit -m "Generate animated ASCII name GIF"
            git push
          fi
