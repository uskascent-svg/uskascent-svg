name: Update live contribution chessboard

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_contribution_board.py"
      - ".github/workflows/update-contribution-board.yml"

permissions:
  contents: write

concurrency:
  group: live-contribution-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate contribution board from public GitHub calendar
        env:
          GITHUB_USERNAME: uskascent-svg
        run: python3 scripts/update_contribution_board.py
      - name: Commit board only when changed
        run: |
          if git diff --quiet -- assets/chess-contributions.svg; then
            echo "Contribution board is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chess-contributions.svg
          git commit -m "chore: refresh live contribution chessboard"
          git push
