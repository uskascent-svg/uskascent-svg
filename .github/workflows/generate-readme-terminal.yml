name: Generate README character-by-character terminal GIF

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/readme-terminal.gif"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-terminal-gif
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render animated GIF
        run: python scripts/generate_readme_terminal.py
      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme-terminal.gif
          if git diff --cached --quiet; then
            echo "GIF is already up to date."
            exit 0
          fi
          git commit -m "Generate character-by-character README terminal GIF"
          git push origin HEAD:main
