name: Validate Profile README

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - ".github/scripts/validate_readme.py"
      - ".github/workflows/validate-readme.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - ".github/scripts/validate_readme.py"
      - ".github/workflows/validate-readme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate README and visual assets
        run: python .github/scripts/validate_readme.py
