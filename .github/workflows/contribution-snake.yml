name: Generate contribution snake

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: uskascent-svg
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322D3EE&color_dots=%2307111F,%23102B45,%23125B91,%23168FCB,%2363C8FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2363C8FF&color_dots=%2307111F,%23102B45,%23125B91,%23168FCB,%2363C8FF

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
