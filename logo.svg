<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">AscentU3 digital pixel logo</title><desc id="desc">A cyan and ice-white AscentU3 wordmark surrounded by animated data streams and particles.</desc>
<defs><radialGradient id="bg"><stop stop-color="#06232b"/><stop offset="1" stop-color="#02080d"/></radialGradient><linearGradient id="ink" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d9fbff"/><stop offset=".5" stop-color="#38efff"/><stop offset="1" stop-color="#078da4"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#34eaff" opacity=".8"/></pattern><style>@keyframes drift{to{transform:translateX(-70px)}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}.stream{animation:drift 9s linear infinite}.word{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.stream,.word{animation:none}}</style></defs>
<rect width="1200" height="360" rx="12" fill="url(#bg)"/>
<g fill="none" stroke="#14dff4" stroke-width="1" opacity=".5" class="stream"><path d="M-30 85 Q180 210 350 140 T720 120 T1240 40"/><path d="M-30 265 Q180 175 380 250 T760 260 T1240 205" stroke-dasharray="2 7"/><path d="M-30 305 Q200 220 420 300 T840 300 T1240 250" stroke-dasharray="1 8"/></g>
<g fill="url(#dots)" opacity=".8"><path d="M0 40 Q170 130 320 120 L320 190 Q160 205 0 120Z"/><path d="M820 230 Q1010 170 1200 70 L1200 120 Q1030 245 820 275Z"/></g>
<g class="word" filter="url(#glow)"><text x="600" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="142" font-weight="900" letter-spacing="-5" fill="url(#ink)">AscentU3</text><text x="600" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="142" font-weight="900" letter-spacing="-5" fill="none" stroke="#bdfaff" stroke-width=".8" opacity=".7">AscentU3</text></g>
<g fill="#52f4ff"><circle cx="112" cy="70" r="2"/><circle cx="176" cy="106" r="1.5"/><circle cx="1000" cy="90" r="2"/><circle cx="1080" cy="260" r="1.5"/><circle cx="270" cy="300" r="1.6"/><circle cx="900" cy="310" r="1.8"/></g>
<path d="M70 326 H1130" stroke="#1b7885" stroke-opacity=".6"/><text x="600" y="346" text-anchor="middle" fill="#76b9c1" font-family="monospace" font-size="10" letter-spacing="4">DETECT · BUILD · ASCEND</text>
</svg>