<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">ASCENTU3 animated ASCII logo</title>
<desc id="desc">A cyan and teal ASCII rendition of the ASCENTU3 logo, with a looping shimmer and pixel drift.</desc>
